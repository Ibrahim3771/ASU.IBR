<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>جولة 3D — كوفي درر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tour.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="scene"></div>
  <div class="hud">
    <div class="top">
      <div class="brand">
        <img src="assets/images/durar-logo.png" alt="درر" />
        <strong>درر · DURAR</strong>
      </div>
      <div class="links">
        <a href="index.html">العودة للتصميم</a>
      </div>
    </div>
    <div class="views" id="views"></div>
    <div class="bottom">
      <div class="info">
        <h2 id="viewTitle">الواجهة</h2>
        <p id="viewText">محل بعرض 3.80 م وطول 10.86 م. حرّك الماوس للتدوير، أو اختر نقطة نظر.</p>
      </div>
      <div class="mode">
        <button id="orbitBtn" class="active">تدوير</button>
        <button id="walkBtn">مشي</button>
      </div>
      <p class="hint">في وضع المشي: اضغط للدخول ثم W A S D. مسافة للخروج.</p>
    </div>
  </div>
  <script type="module" src="js/tour.js"></script>
</body>
</html>
